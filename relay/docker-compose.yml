# docker-compose.yml — the whole deployment.
#
# Everything below the storage credentials has a working default. Bring it up,
# open the port, and add destinations in the browser.

services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    # Or, once there is a published image:
    # image: ghcr.io/stageaudioworks/multisite-relay:latest
    restart: unless-stopped
    # THIS LINE is what decides who can reach the relay, not anything inside
    # the container. Bound to the host's localhost on purpose: this service can
    # change where a church's service is sent, so publishing it to the internet
    # has to be a decision rather than a default.
    #
    # Reach it over an SSH tunnel:  ssh -L 8080:localhost:8080 you@your-server
    # or put a TLS proxy in front of it (see Caddyfile.example) pointing at
    # 127.0.0.1:8080. If you genuinely want it open, change this to
    # "8080:8080" and understand that the password then crosses the network
    # readable.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - relay-data:/data
    environment:
      # Which feed to relay. Must match the name set at the main site.
      RELAY_ROOM: main-auditorium

      # The operator login. Set these to claim the relay before anyone can
      # reach it; leave them out and the first person to open the page sets
      # the login instead. Applied only when no login exists yet, so changing
      # the password in the browser is not undone by a restart.
      # RELAY_USER: ""
      # RELAY_PASSWORD: ""

      # Storage. These seed the settings on first run only — after that, what
      # is in the database wins, so a value changed in the browser is not
      # overwritten on the next restart. They can be left out entirely and
      # filled in on the Settings page instead.
      RELAY_BUCKET: ""
      RELAY_R2_ACCOUNT_ID: ""       # for Cloudflare R2
      # RELAY_ENDPOINT_HOST: "s3.eu-west-1.amazonaws.com"   # for anything else
      RELAY_ACCESS_KEY_ID: ""
      RELAY_SECRET_ACCESS_KEY: ""
      RELAY_REGION: "auto"
      # Only for storage on your own network without a certificate.
      # RELAY_USE_HTTPS: "0"

    # A relay pushing one 6 Mbps stream needs very little of either. The limits
    # are here so a runaway cannot take the rest of a small VPS down with it.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

volumes:
  relay-data:
