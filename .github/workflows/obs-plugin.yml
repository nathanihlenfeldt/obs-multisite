name: obs plugin build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Compiles the OBS plugin module against real libobs headers from the distro.
  # This is the cheap, fast guard on our OBS API usage — it catches API
  # mistakes without needing the full obs-deps toolchain.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install libobs, FFmpeg and libcurl
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libobs-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libcurl4-openssl-dev
          echo "--- versions ---"
          pkg-config --modversion libobs
          pkg-config --modversion libavformat

      - name: Configure (plugin enabled)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_OBS_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify the module exports OBS's entry points
        run: |
          set -e
          test -f build/obs-multisite.so
          for sym in obs_module_load obs_module_unload obs_module_set_pointer \
                     obs_module_ver obs_module_description; do
            nm -D --defined-only build/obs-multisite.so | grep -q " $sym$" \
              || { echo "MISSING SYMBOL: $sym"; exit 1; }
            echo "ok: $sym"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multisite-linux
          path: build/obs-multisite.so

  # Produces the actual installable Windows plugin. Builds libobs from the
  # pinned OBS release plus prebuilt obs-deps, then builds the plugin against it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Don't hardcode a Visual Studio version: the runner image changes over
      # time. Ask vswhere what's installed and map it to a CMake generator,
      # falling back to CMake's own default.
      - name: Detect Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $gen = ""
          if (Test-Path $vswhere) {
            Write-Host "--- Visual Studio installations ---"
            & $vswhere -latest -products * -format value `
              -property catalog_productDisplayVersion
            $line = & $vswhere -latest -products * -property catalog_productLineVersion
            Write-Host "product line version: $line"
            switch ("$line") {
              "2022" { $gen = "Visual Studio 17 2022" }
              "2026" { $gen = "Visual Studio 18 2026" }
              default { $gen = "" }
            }
          } else {
            Write-Host "vswhere not found at $vswhere"
          }
          if ($gen -eq "") {
            Write-Host "using CMake's default generator"
          } else {
            Write-Host "using generator: $gen"
          }
          echo "CMAKE_GEN=$gen" >> $env:GITHUB_ENV

      - name: Fetch obs-deps (prebuilt Windows dependencies)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/obsproject/obs-deps/releases/download/2025-07-11/windows-deps-2025-07-11-x64.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile deps.zip
          Expand-Archive deps.zip -DestinationPath "$env:GITHUB_WORKSPACE\obs-deps"
          Write-Host "--- obs-deps top level ---"
          Get-ChildItem "$env:GITHUB_WORKSPACE\obs-deps" | Select-Object -First 20 | Format-Table Name
          echo "OBS_DEPS=$env:GITHUB_WORKSPACE\obs-deps" >> $env:GITHUB_ENV

      - name: Fetch and build libobs from the pinned OBS release
        shell: pwsh
        run: |
          $tag = "31.1.1"
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/$tag.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs-src
          $obs = (Get-ChildItem obs-src -Directory | Select-Object -First 1).FullName
          Write-Host "obs source dir: $obs"
          # Configure only what libobs needs. Extra flags keep OBS's own
          # plugin/UI/browser targets out of the build.
          $genArgs = @()
          if ($env:CMAKE_GEN -ne "") { $genArgs += @("-G", $env:CMAKE_GEN, "-A", "x64") }
          cmake -S $obs -B obs-build @genArgs `
            -DCMAKE_PREFIX_PATH="$env:OBS_DEPS" `
            -DENABLE_PLUGINS=OFF -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF `
            -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF -DENABLE_VLC=OFF `
            -DENABLE_VIRTUALCAM=OFF -DBUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { Write-Host "libobs CONFIGURE failed"; exit 1 }
          cmake --build obs-build --config Release --target libobs
          if ($LASTEXITCODE -ne 0) { Write-Host "libobs BUILD failed"; exit 1 }
          Write-Host "--- built libobs artifacts ---"
          Get-ChildItem -Recurse obs-build -Include obs.lib,obs.dll -ErrorAction SilentlyContinue |
            Select-Object FullName | Format-Table -AutoSize
          # Hand the plugin explicit paths: bypassing libobsConfig.cmake avoids
          # its find_dependency(w32-pthreads), which a build tree doesn't export.
          $obslib = Get-ChildItem -Recurse obs-build -Filter obs.lib -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $obslib) { Write-Host "obs.lib not found after build"; exit 1 }
          Write-Host "obs.lib: $($obslib.FullName)"
          echo "LIBOBS_BUILD=$env:GITHUB_WORKSPACE\obs-build" >> $env:GITHUB_ENV
          echo "LIBOBS_INCLUDE_DIR=$obs\libobs" >> $env:GITHUB_ENV
          echo "LIBOBS_LIBRARY=$($obslib.FullName)" >> $env:GITHUB_ENV

      - name: Configure plugin
        shell: pwsh
        run: |
          $genArgs = @()
          if ($env:CMAKE_GEN -ne "") { $genArgs += @("-G", $env:CMAKE_GEN, "-A", "x64") }
          cmake -S . -B build @genArgs `
            -DBUILD_OBS_PLUGIN=ON `
            -DCMAKE_PREFIX_PATH="$env:OBS_DEPS" `
            -DLIBOBS_INCLUDE_DIR="$env:LIBOBS_INCLUDE_DIR" `
            -DLIBOBS_LIBRARY="$env:LIBOBS_LIBRARY"

      - name: Build plugin
        run: cmake --build build --config Release

      # Output location differs by generator: multi-config (Visual Studio) puts
      # the DLL in build/Release, single-config in build/. Locate it and stage
      # it so the artifact path is stable either way.
      - name: Stage the built DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter obs-multisite.dll -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Host "obs-multisite.dll not found under build/"
            Get-ChildItem -Recurse build -Filter *.dll | Select-Object FullName | Format-Table -AutoSize
            exit 1
          }
          Write-Host "found: $($dll.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll.FullName dist/
          Copy-Item -Recurse data dist/data -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: obs-multisite-windows
          path: dist/
