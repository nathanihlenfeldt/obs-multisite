name: core reliability tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon. It is here to keep the CommonCrypto
        # decision true: a Mac has no OpenSSL, so a regression reintroducing
        # that dependency would build on the other two runners and fail only
        # on the platform nobody was testing.
        os: [ ubuntu-latest, windows-latest, macos-14 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Optional deps enable the CMAF muxer + S3 transport targets. If they are
      # missing the CMake build skips those targets and the reliability/session
      # suites still run.
      - name: Install FFmpeg and libcurl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libcurl4-openssl-dev
          echo "--- dependency versions ---"
          ffmpeg -version | head -1
          pkg-config --modversion libavformat
          pkg-config --modversion libcurl

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "--- dependency versions ---"
          ffmpeg -version | head -1
          # Deliberately no OpenSSL: the point of this leg is that the core
          # needs none on a Mac.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # -V prints the CMAF driver's diagnostics (ffmpeg version, encoder used,
      # fixture streams, per-fragment frame counts) so any failure is legible.
      # "It compiled" is not the property that matters here. "It will load on
      # a Mac that has never had Homebrew" is, and that means no libcrypto.
      - name: Verify no OpenSSL is linked (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "--- linked libraries ---"
          otool -L build/test_crypto
          if otool -L build/test_crypto | grep -qiE 'libcrypto|libssl'; then
            echo "::error::the core linked OpenSSL on macOS; CommonCrypto should be used"
            exit 1
          fi
          echo "no OpenSSL linked, as intended"

      - name: Test
        run: ctest --test-dir build -C Release -V --output-on-failure
