name: core reliability tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon. It is here to keep the CommonCrypto
        # decision true: a Mac has no OpenSSL, so a regression reintroducing
        # that dependency would build on the other two runners and fail only
        # on the platform nobody was testing.
        os: [ ubuntu-latest, windows-latest, macos-14 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Optional deps enable the CMAF muxer + S3 transport targets. If they are
      # missing the CMake build skips those targets and the reliability/session
      # suites still run.
      - name: Install FFmpeg and libcurl (Linux)
        if: runner.os == 'Linux'
        run: |
          # A hash-sum mismatch on an unrelated third-party repo (observed:
          # dl.google.com/linux/chrome-stable, which GitHub's runner image
          # ships preinstalled for Chrome and which nothing here needs) fails
          # `apt-get update` outright, even though every repo this job
          # actually uses fetched cleanly. Drop any repo we did not add
          # ourselves before updating, so a stale mirror we have no use for
          # cannot block a build that does not depend on it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libcurl4-openssl-dev \
            libdrm-dev libasound2-dev libqrencode-dev libfreetype-dev
          echo "--- dependency versions ---"
          ffmpeg -version | head -1
          pkg-config --modversion libavformat
          pkg-config --modversion libcurl
          # libdrm and ALSA are the appliance's actual output paths. Without
          # them CMake builds the player with no display and no audio, so
          # drm_output.cpp and alsa_output.cpp were not compiled by anything in
          # CI — including the audio path whose six-tracks-into-one-device
          # fault was what made a campus player run at five frames a second.
          pkg-config --modversion libdrm
          pkg-config --modversion alsa
          # libqrencode draws the QR tile on the identity screen; same rule.
          pkg-config --modversion libqrencode
          # freetype renders the anti-aliased text; same rule.
          pkg-config --modversion freetype2

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "--- dependency versions ---"
          ffmpeg -version | head -1
          # Deliberately no OpenSSL: the point of this leg is that the core
          # needs none on a Mac.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # -V prints the CMAF driver's diagnostics (ffmpeg version, encoder used,
      # fixture streams, per-fragment frame counts) so any failure is legible.
      # "It compiled" is not the property that matters here. "It will load on
      # a Mac that has never had Homebrew" is, and that means no libcrypto.
      - name: Verify no OpenSSL is linked (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "--- linked libraries ---"
          otool -L build/test_crypto
          if otool -L build/test_crypto | grep -qiE 'libcrypto|libssl'; then
            echo "::error::the core linked OpenSSL on macOS; CommonCrypto should be used"
            exit 1
          fi
          echo "no OpenSSL linked, as intended"

      - name: Test
        run: ctest --test-dir build -C Release -V --output-on-failure
